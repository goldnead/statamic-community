name: Tests

on:
  push:
    branches: [main]
  pull_request:

# This repository is private: with an empty permission set the job token cannot
# read it and actions/checkout fails on every job.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # Statamic 6 requires laravel/framework ^12.40 || ^13.0, so an ^11.0 leg
        # can never resolve.
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '^13.0'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  mysql:
    name: MySQL 8
    runs-on: ubuntu-latest

    # Column widths and the `text` size limit exist only on a real server.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: community_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, intl, fileinfo
          coverage: none

      - run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run the suite against MySQL
        run: vendor/bin/phpunit -c phpunit.mysql.xml

  # brand-context is a suggest. The matrix above runs with it (require-dev);
  # this leg removes it, which is the install of a customer who never added it.
  standalone:
    runs-on: ubuntu-latest
    name: Without brand-context

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, intl, fileinfo
          coverage: none

      - run: composer remove --dev goldnead/statamic-brand-context --no-interaction --no-update

      - run: composer update --prefer-dist --no-interaction

      - run: test ! -d vendor/goldnead/statamic-brand-context

      - run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      # Check, never fix: auto-committing style changes rewrites a contributor's branch.
      - run: vendor/bin/pint --test

  analyse:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --no-progress

  standards:
    runs-on: ubuntu-latest
    name: Addon standards

    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
          # release.versioning reads the repository's tags.
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: goldnead/statamic-addon-studio
          path: studio

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run addon-lint
        run: php studio/tools/addon-lint/bin/addon-lint addon --no-color --fail-on=major -v

  assets:
    runs-on: ubuntu-latest
    name: Built assets are current

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # The committed bundle inlines code from the @statamic/cms npm package, which
      # comes from the installed statamic/cms Composer package. composer.lock is not
      # committed, so an unpinned install pulls whatever Statamic released last and the
      # fresh build drifts from the committed dist with no source change (6.42.0 -> 6.44.0
      # did exactly that). Pin the version the dist was built against. To bump: change the
      # version here, rebuild with `npm ci && npm run build`, commit dist together with this file.
      - name: Pin statamic/cms to the dist build version
        run: composer require "statamic/cms:6.42.0" --no-update --no-interaction

      # `@statamic/cms` is installed from vendor/, so Composer runs first.
      - run: composer install --prefer-dist --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      # The consumers of this addon have no Node toolchain: what is committed
      # in dist/ is what they load.
      - name: Fail when dist/ differs from a fresh build
        run: git diff --exit-code -- dist
